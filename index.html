<!doctype html>
<html lang="en" dir="ltr" data-theme="nordic-forest">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf0e8" />
    <title>Prompt archive</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="flight-layer" aria-hidden="true">
      <span class="flight-object"></span>
      <span class="flight-object"></span>
      <span class="flight-object"></span>
      <span class="flight-object"></span>
      <span class="flight-object"></span>
      <span class="flight-object"></span>
      <span class="flight-object"></span>
      <span class="flight-object"></span>
      <span class="flight-object"></span>
      <span class="flight-object"></span>
      <span class="flight-object"></span>
      <span class="flight-object"></span>
    </div>
    <div class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="./" aria-label="Prompt archive home">
          <span class="wordmark-mark" aria-hidden="true">P<span>/</span></span>
          <span>prompt archive</span>
        </a>
        <span class="storage-note"
          ><span class="status-dot" aria-hidden="true"></span> SAVED IN THIS
          BROWSER</span
        >
      </header>

      <main class="workspace">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">A SMALL TOOL FOR BIG IDEAS</p>
          <h1 id="page-title">Keep your good prompts close.</h1>
          <p class="intro-copy">
            A personal shelf for the words that get you somewhere.
          </p>
        </section>

        <fieldset class="theme-switcher" aria-label="Choose a visual theme">
          <legend>Choose a theme</legend>
          <div class="theme-options">
            <button
              class="theme-option"
              type="button"
              data-theme-choice="cyberpunk"
              aria-pressed="false"
            >
              <span
                class="theme-swatch swatch-cyberpunk"
                aria-hidden="true"
              ></span>
              <span>Cyberpunk</span>
            </button>
            <button
              class="theme-option"
              type="button"
              data-theme-choice="nordic-forest"
              aria-pressed="true"
            >
              <span
                class="theme-swatch swatch-nordic"
                aria-hidden="true"
              ></span>
              <span>Nordic Forest</span>
            </button>
            <button
              class="theme-option"
              type="button"
              data-theme-choice="retro-paper"
              aria-pressed="false"
            >
              <span class="theme-swatch swatch-retro" aria-hidden="true"></span>
              <span>Retro Paper</span>
            </button>
          </div>
        </fieldset>

        <div class="library-layout">
          <section class="composer panel" aria-labelledby="composer-title">
            <div class="section-heading">
              <h2 id="composer-title">New Prompt</h2>
            </div>
            <form id="prompt-form">
              <div class="field">
                <label for="prompt-title">Title</label>
                <input
                  id="prompt-title"
                  name="title"
                  type="text"
                  placeholder="e.g. Explain a tricky concept"
                  maxlength="100"
                  required
                />
              </div>
              <div class="field">
                <label for="prompt-content">Prompt</label>
                <textarea
                  id="prompt-content"
                  name="content"
                  rows="8"
                  placeholder="Write or paste your prompt here..."
                  required
                ></textarea>
              </div>
              <button class="save-button" type="submit">
                <span aria-hidden="true">+</span>
                Save prompt
              </button>
              <p
                id="form-message"
                class="form-message"
                role="status"
                aria-live="polite"
              ></p>
            </form>
          </section>

          <section class="collection" aria-labelledby="collection-title">
            <div class="collection-heading">
              <div class="section-heading">
                <h2 id="collection-title">Saved prompts</h2>
              </div>
            </div>
            <div class="field search-field">
              <label for="prompt-search">Search saved prompts</label>
              <input
                id="prompt-search"
                name="search"
                type="search"
                placeholder="Search titles and prompt text"
                autocomplete="off"
              />
            </div>
            <div id="prompt-list" class="prompt-list" aria-live="polite"></div>
            <template id="prompt-notes-template">
              <section class="prompt-notes" aria-label="Notes for prompt">
                <h4>Notes</h4>
                <ul class="note-list"></ul>
                <form class="note-form">
                  <div class="field">
                    <label class="note-label">Add a note</label>
                    <textarea
                      class="note-input"
                      rows="3"
                      maxlength="1000"
                      placeholder="Keep a thought with this prompt..."
                      required
                    ></textarea>
                  </div>
                  <button class="note-add-button" type="submit">
                    Add note
                  </button>
                  <p class="note-message" role="status" aria-live="polite"></p>
                </form>
              </section>
            </template>
          </section>
        </div>
      </main>

      <footer class="footer-note">
        <span class="footer-mark" aria-hidden="true">//</span> Your prompts stay
        on this device.
      </footer>
    </div>
  </body>
</html>
